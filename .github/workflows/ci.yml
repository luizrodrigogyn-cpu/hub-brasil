name: Verificação do Hub Brasil

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Usar Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Impedir mistura de gerenciadores de dependência
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f pnpm-workspace.yaml ]; then
            echo "Este projeto usa npm. Remova arquivos PNPM antes de publicar."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Verificar padrão do código
        run: npm run lint

      - name: Executar testes
        run: npm test
