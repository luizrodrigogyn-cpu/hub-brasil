name: Verificação do Hub Brasil

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Usar Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar padrão do código
        run: npm run lint

      - name: Executar testes
        run: npm test
